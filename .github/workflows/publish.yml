# Publishes this n8n community node package to npm on every version tag push.
# n8n requires verified nodes to be published by GitHub Actions with provenance.
name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci
      - name: Release
        run: npm run release
